[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vrp-cat"
version = "0.1.0"
description = "Categorical modeling for visual relationship prediction (PredCls), with empty hom-set support"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.23.0",
]

[tool.setuptools]
packages = ["vrp"]
